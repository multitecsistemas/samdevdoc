site_name: SAM4Devs
repo_url: https://github.com/multitecsistemas/samdevdoc
repo_name: multitecsistemas/samdevdoc
edit_uri: ""

nav:    
    - Comece Aqui: index.md
    - Debug:
        - Formulas/Relatorios: debug/formulas.md
        - Script de Operaçoes: debug/scripts.md
    - Classes Bases: 
        - FormulaBase: classesBase/formulaBase.md
        - RelatorioBase: classesBase/RelatorioBase.md
    - Classes Uteis:
        - Formulas: classesUteis/formulas.md
        - Relatorios: classesUteis/relatorios.md
        - Scripts de Operaçoes: classesUteis/scripts.md
    - Componentes:
        - Relatorios: componentes/relatorios.md
        - Telas: componentes/telas.md
    - Metodos:
        - Metodos de Formulas: metodos/metodosFormulas.md
        - Metodos de Relatorios: metodos/metodosRelatorios.md

        
theme: 
    name: material
    language: pt
    features:
        - navigation.sections
        - navigation.top
    palette: 
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Ativar modo escuro
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Desativar modo escuro
         
copyright: Copyright &copy; 2021 Multitec Sistemas

extra_css:
    - css/extra.css
    
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.superfences
  - abbr
  - def_list
  - pymdownx.tabbed:
      alternate_style: true 
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/multitecsistemas